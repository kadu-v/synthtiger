coord_output: true
mask_output: true
glyph_coord_output: true
glyph_mask_output: true

vertical: false
quality: [50, 95]
visibility_check: true

midground: 0
midground_offset:
  percents: [[-0.5, 0.5], [-0.5, 0.5]]
foreground_mask_pad: 5

address_corpus:
  paths: [resources/corpus/address.txt]
  weights: [1]
  min_length: 1
  max_length: 50

building_corpus:
  paths: [resources/corpus/building.txt]
  weights: [1]
  min_length: 1
  max_length: 30

building_prob: 1.0
separator: " "

pitch:
  mode: building_pitch
  full_pitch_range: [0.5, 1.0]
  address_pitch: 1.0
  building_pitch_range: [0.5, 0.5]
  mixed_weights: [1, 1]

left_pad_ratio: [0.5, 1.0]

font:
  paths: [resources/font]
  weights: [1]
  size: [40, 80]
  bold: 0.5

texture:
  prob: 0.5
  args:
    paths: [resources/image]
    weights: [1]
    alpha: [0, 1]
    grayscale: 0
    crop: 1

colormap2:
  paths: [resources/colormap/iiit5k_gray.txt]
  weights: [1]
  k: 2
  alpha: [1, 1]
  colorize: 1

colormap3:
  paths: [resources/colormap/iiit5k_gray.txt]
  weights: [1]
  k: 3
  alpha: [1, 1]
  colorize: 1

color:
  gray: [0, 255]
  alpha: [1, 1]
  colorize: 1

shape:
  prob: 1
  args:
    weights: [1, 1]
    args:
      - alpha: [15, 30]
        sigma: [4, 12]
      - alpha: [0, 2]
        sigma: [0, 0.6]

layout:
  weights: [1, 0]
  args:
    - space: [-2, 5]
      line_align: [middle]
    - curve: [20, 40]
      space: [-2, 5]
      convex: 0.5
      upward: 0.5

style:
  prob: 0.25
  args:
    weights: [1, 2, 2]
    args:
      - size: [1, 12]
        alpha: [1, 1]
        grayscale: 0
      - distance: [1, 6]
        angle: [0, 360]
        alpha: [0.3, 0.7]
        grayscale: 0
      - length: [1, 12]
        angle: [0, 360]
        alpha: [1, 1]
        grayscale: 0

transform:
  prob: 1
  args:
    weights: [1, 1, 1, 1, 1, 1, 2]
    args:
      - percents: [[0.5, 1], [1, 1]]
        aligns: [[0, 0], [0, 0]]
      - percents: [[1, 1], [0.5, 1]]
        aligns: [[0, 0], [0, 0]]
      - weights: [1, 0, 1, 0]
        percent: [0.75, 1]
        align: [-1, 1]
      - weights: [0, 1, 0, 1]
        percent: [0.5, 1]
        align: [-1, 1]
      - weights: [1, 0]
        angle: [0, 30]
        ccw: 0.5
      - weights: [0, 1]
        angle: [0, 10]
        ccw: 0.5
      - angle: [0, 10]
        ccw: 0.5

pad:
  prob: 1
  args:
    pxs: [[0, 10], [0, 10], [0, 10], [0, 10]]

postprocess:
  args:
    - prob: 1
      args:
        scale: [4, 8]
        per_channel: 0
    - prob: 0.9
      args:
        sigma: [0, 2]
    - prob: 0.1
      args:
        size: [0.4, 0.4]
    - prob: 1
      args:
        k: [1, 1]
